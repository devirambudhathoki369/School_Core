name: schoolcore

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-backend: &backend
  image: ${COMPOSE_PROJECT_NAME:-schoolcore}-backend:local
  build:
    context: ./backend
  init: true
  environment: &backend-environment
    DJANGO_SETTINGS_MODULE: backend.docker_settings
    DEBUG: "false"
    DOCKER_LOCAL_HTTP: ${DOCKER_LOCAL_HTTP:-false}
    SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
    FIELD_ENCRYPTION_KEYS: ${FIELD_ENCRYPTION_KEYS:-}
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
    POSTGRE: "true"
    POSTGRES_NAME: ${POSTGRES_DB:-schoolcore}
    POSTGRES_USER: schoolcore_app
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    REDIS_URL: redis://redis:6379/0
    MEDIA_ROOT: /data/media
    PRIVATE_MEDIA_ROOT: /data/private_media
    STATIC_ROOT: /data/static
    LOG_DIR: /data/logs
    DATABASE_BACKUP_DIR: /data/backup_jobs
    GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
    GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-180}
    NUM_PROXIES: ${NUM_PROXIES:-1}
    SENTRY_DSN: ${SENTRY_DSN:-}
    FCM_URL: ${FCM_URL:-}
    SERVICE_ACCOUNT_PATH: ${SERVICE_ACCOUNT_PATH:-}
    BUS_TRACKING_CONFIG_FILE: ${BUS_TRACKING_CONFIG_FILE:-/run/secrets/schoolcore/bus_tracking.json}
    TRACKON_API: ${TRACKON_API:-}
    TRACKON_USERNAME: ${TRACKON_USERNAME:-}
    TRACKON_PASSWORD: ${TRACKON_PASSWORD:-}
    TRACKON_TOKEN: ${TRACKON_TOKEN:-}
    SMS_BULK_API: ${SMS_BULK_API:-}
    SMS_CREDITS_API: ${SMS_CREDITS_API:-}
    SMS_REPORT_API: ${SMS_REPORT_API:-https://sms.aakashsms.com/sms/v1/report/api}
    ICLOCK_REQUIRE_PUSH_KEY: ${ICLOCK_REQUIRE_PUSH_KEY:-false}
  volumes:
    - media:/data/media
    - private_media:/data/private_media
    - static:/data/static
    - backend_logs:/data/logs
    - backup_jobs:/data/backup_jobs
    - ./docker/secrets:/run/secrets/schoolcore:ro
  logging: *logging

services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-schoolcore}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
      APP_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      MIGRATE_PASSWORD: ${POSTGRES_MIGRATE_PASSWORD:?Set POSTGRES_MIGRATE_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/10-schoolcore.sh:ro
      - ./backend/tools/database/db_roles.sql:/opt/schoolcore/db_roles.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes", --maxmemory, 256mb, --maxmemory-policy, noeviction]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  setup:
    <<: *backend
    restart: "no"
    command: [sh, /app/docker/setup.sh]
    environment:
      <<: *backend-environment
      POSTGRES_MIGRATE_USER: schoolcore_migrate
      POSTGRES_MIGRATE_PASSWORD: ${POSTGRES_MIGRATE_PASSWORD:?Set POSTGRES_MIGRATE_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend:
    <<: *backend
    restart: unless-stopped
    depends_on:
      setup:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, /app/docker/healthcheck.py]
      interval: 20s
      timeout: 10s
      start_period: 30s
      retries: 5

  frontend:
    image: ${COMPOSE_PROJECT_NAME:-schoolcore}-frontend:local
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost:18081}
        NEXT_PUBLIC_DOMAIN: ${NEXT_PUBLIC_DOMAIN:-http://localhost:18080}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
        NEXT_PUBLIC_ALLOWED_ROLES: ${NEXT_PUBLIC_ALLOWED_ROLES:-admin,staff,student,superadmin,superuser,canteen}
        NEXT_PUBLIC_DEFAULT_ADMIN_VIEW: ${NEXT_PUBLIC_DEFAULT_ADMIN_VIEW:-dashboard}
        NEXT_PUBLIC_SMS_PORTAL: ${NEXT_PUBLIC_SMS_PORTAL:-}
        NEXT_PUBLIC_SMS_TOKEN_PAGE: ${NEXT_PUBLIC_SMS_TOKEN_PAGE:-}
        NEXT_PUBLIC_SENTRY: ${NEXT_PUBLIC_SENTRY:-off}
        NEXT_PUBLIC_SENTRY_FEEDBACK: ${NEXT_PUBLIC_SENTRY_FEEDBACK:-off}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    init: true
    restart: unless-stopped
    environment:
      INTERNAL_API_URL: http://backend:8000
      MAINTENANCE: ${MAINTENANCE:-off}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/privacy_policy').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 10s
      start_period: 30s
      retries: 5
    logging: *logging

  proxy:
    image: nginx:stable-alpine
    restart: unless-stopped
    environment:
      # Set to https only when a trusted TLS terminator fronts these loopback ports.
      PROXY_SCHEME: ${PROXY_SCHEME:-http}
      NGINX_ENVSUBST_FILTER: ^PROXY_SCHEME$$
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-18080}:8080"
      - "${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-18081}:8081"
    volumes:
      - ./docker/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - media:/srv/media:ro
      - static:/srv/static:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8080/proxy-health"]
      interval: 20s
      timeout: 5s
      retries: 5
    logging: *logging

  scheduler:
    <<: *backend
    profiles: [jobs]
    restart: unless-stopped
    command: [python, /app/docker/scheduler.py]
    environment:
      <<: *backend-environment
      ENABLE_BIRTHDAY_PUSH: ${ENABLE_BIRTHDAY_PUSH:-false}
      ENABLE_BIRTHDAY_SMS: ${ENABLE_BIRTHDAY_SMS:-false}
      ENABLE_ABSENT_PUSH: ${ENABLE_ABSENT_PUSH:-false}
      ENABLE_COLLECTION_SMS: ${ENABLE_COLLECTION_SMS:-false}
      ENABLE_SMS_DELIVERY_SYNC: ${ENABLE_SMS_DELIVERY_SYNC:-false}
    volumes:
      - media:/data/media
      - private_media:/data/private_media
      - backend_logs:/data/logs
      - scheduler_state:/data/scheduler
      - ./docker/secrets:/run/secrets/schoolcore:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  media:
  private_media:
  static:
  backend_logs:
  backup_jobs:
  scheduler_state:
