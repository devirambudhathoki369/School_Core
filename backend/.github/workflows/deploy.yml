name: Deploy backend to VPS

# Push-to-deploy: any push to main (or a manual run) ships to the production VPS.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys run at once (no half-applied migrations / racing reloads).
concurrency:
  group: vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for the deploy script)
        uses: actions/checkout@v4

      - name: Deploy over SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes \
            root@"${{ secrets.VPS_HOST }}" 'bash -s' < deploy/vps_deploy.sh
