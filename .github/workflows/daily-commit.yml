# One commit on main every day, as devirambudhathoki369, until it is turned
# off (Actions → Daily commit → Disable workflow). No laptop is needed.
#
# Each run takes the next prepared change from .github/streak/queue (a patch
# made and tested beforehand), commits it dated the day it runs, and pushes
# it. Once the queue is empty, each day adds a line to .github/streak/log.md
# instead. It runs twice a day in case GitHub drops one run; a day that
# already has a commit is left alone. "Run workflow" by hand does a dry run
# unless you untick it.
name: Daily commit

on:
  schedule:
    - cron: "30 4 * * *"   # every day, 10:15 in Nepal
    - cron: "30 10 * * *"  # 16:15 in Nepal, if the first run was dropped
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Apply the next change without pushing it"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: daily-commit

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Commit and push the next change
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          git config user.name "devirambudhathoki369"
          git config user.email "devirambudhathoki369@gmail.com"
          today=$(TZ=Asia/Kathmandu date +%F)

          # one commit a day: the second run skips when today already has one
          last=$(TZ=Asia/Kathmandu git log -1 --format=%cd --date=format-local:%F)
          if [ "$last" = "$today" ] && [ "$DRY_RUN" != "true" ]; then
            echo "Today ($today) already has a commit."; exit 0
          fi

          next=$(ls .github/streak/queue/*.patch 2>/dev/null | sort | head -n 1 || true)
          if [ -n "$next" ]; then
            # the patch carries its author and message; --ignore-date dates it today
            git am --ignore-date --3way "$next"
            git rm -q "$next"
            git commit -q --amend --no-edit
          else
            echo "- $today" >> .github/streak/log.md
            git add .github/streak/log.md
            git commit -q -m "chore: daily log, $today"
          fi
          git log -1 --format='%h %an <%ae> %ad%n%s' --stat

          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: not pushed."; exit 0
          fi
          git push origin HEAD:main
