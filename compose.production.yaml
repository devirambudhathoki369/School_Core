# Use with: docker compose -f compose.yaml -f compose.production.yaml ...
# Requires Docker Compose >= 2.24.4 for !override.
services:
  setup:
    environment:
      DOCKER_LOCAL_HTTP: "false"
  backend:
    environment:
      DOCKER_LOCAL_HTTP: "false"
  scheduler:
    environment:
      DOCKER_LOCAL_HTTP: "false"
  proxy:
    environment:
      PROXY_SCHEME: https
      WEB_HOST: ${WEB_HOST:?Set WEB_HOST to your frontend domain}
      API_HOST: ${API_HOST:?Set API_HOST to your API domain}
      NGINX_ENVSUBST_FILTER: ^(WEB_HOST|API_HOST)$$
    ports: !override
      - "${PRODUCTION_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${PRODUCTION_BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/production.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${TLS_CERT_DIR:-./docker/secrets/tls}:/etc/nginx/tls:ro
